[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk_backend"
version = "1.0.0"
description = "Helpdesk backend API (FastAPI) for AI triage + KB"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "python-multipart==0.0.12",
  "httpx==0.27.2",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
# Install the application package only; alembic/ holds migrations, not a package.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
