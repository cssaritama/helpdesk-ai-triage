name: helpdesk-ai-triage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      LLM_MODE: mock
      EMBEDDINGS_MODE: mock
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

  mcp:
    build:
      context: ./mcp_server
    environment:
      MCP_BACKEND_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8765:8765"

volumes:
  pgdata:
